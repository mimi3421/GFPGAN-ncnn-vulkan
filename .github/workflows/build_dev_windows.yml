# CI code is based on
# https://github.com/nihui/realsr-ncnn-vulkan/blob/master/.github/workflows/release.yml
# Modified in here for newer vulkan
# https://github.com/onuralpszr/realsr-ncnn-vulkan/blob/vulkan-ci-version/.github/workflows/CI.yml


name: Windows Dev Build
on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean

env:
  APPLICATION_NAME: gfpgan-ncnn-vulkan
  VULKAN_VERSION: 1.4.313.2
  OPENCV_VERSION: 4.13.0


jobs:
  dev-build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: cache-vulkansdk
      id: cache-vulkansdk
      uses: actions/cache@v4
      with:
        path: "VulkanSDK"
        key: VulkanSDK-${env:VULKAN_VERSION}-Installer
    - name: cache-opencv
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: "OpenCV"
        key: opencv-${env:OPENCV_VERSION}-windows
    - name: vulkansdk
      if: steps.cache-vulkansdk.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe -OutFile VulkanSDK-${env:VULKAN_VERSION}-Installer.exe
        7z x -aoa ./VulkanSDK-${env:VULKAN_VERSION}-Installer.exe -oVulkanSDK
        Remove-Item .\VulkanSDK\Demos -Recurse
    - name: install opencv
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri https://github.com/opencv/opencv/releases/download/${env:OPENCV_VERSION}/opencv-${env:OPENCV_VERSION}-windows.exe -OutFile opencv-${env:OPENCV_VERSION}-windows.exe
        7z x -aoa ./opencv-${env:OPENCV_VERSION}-windows.exe -oOpenCV
    - name: build
      run: |
        $env:OpenCV_DIR="$(pwd)/OpenCV/opencv/build"
        $env:VULKAN_SDK="$(pwd)/VulkanSDK"
        mkdir build; cd build
        cmake -A x64 ../src
        cmake --build . --config Release -j 2

    - name: Pack artifacts
      id: pack_artifacts
      run: |
        7z a gfpgan-ncnn-vulkan.zip .\build\bin\Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        path: gfpgan-ncnn-vulkan.zip
        name: gfpgan-ncnn-vulkan.zip
